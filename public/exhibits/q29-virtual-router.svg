<svg viewBox="0 0 500 240" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill:#1e293b; stroke:#64748b; stroke-width:2; }
    .lbl { fill:#e2e8f0; font-size:12px; }
    .ln { stroke:#64748b; stroke-width:2; }
  </style>
  <rect class="box" x="180" y="20" width="140" height="40" rx="6"/>
  <text class="lbl" x="205" y="45">Core</text>

  <rect class="box" x="140" y="80" width="220" height="60" rx="6" fill="none" stroke-dasharray="4"/>
  <text class="lbl" x="150" y="75">Virtual Router</text>

  <rect class="box" x="150" y="95" width="90" height="35" rx="6"/>
  <text class="lbl" x="158" y="117" font-size="11">Forwarding Router</text>

  <rect class="box" x="260" y="95" width="90" height="35" rx="6"/>
  <text class="lbl" x="280" y="117" font-size="11">Standby Router</text>

  <line class="ln" x1="195" y1="60" x2="195" y2="95"/>
  <line class="ln" x1="305" y1="60" x2="305" y2="95"/>

  <line class="ln" x1="250" y1="130" x2="250" y2="180"/>
  <rect class="box" x="200" y="180" width="100" height="40" rx="6"/>
  <text class="lbl" x="220" y="204">Workstation</text>
</svg>
