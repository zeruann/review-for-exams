<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill:#1e293b; stroke:#64748b; stroke-width:2; }
    .lbl { fill:#e2e8f0; font-size:13px; }
    .sub { fill:#94a3b8; font-size:11px; }
    .ln { stroke:#64748b; stroke-width:2; }
  </style>
  <rect class="box" x="20" y="70" width="110" height="50" rx="6"/>
  <text class="lbl" x="30" y="90">DHCP Server</text>
  <text class="sub" x="30" y="108">192.168.1.8/24</text>

  <line class="ln" x1="130" y1="95" x2="220" y2="95"/>
  <rect class="box" x="220" y="70" width="90" height="50" rx="6"/>
  <text class="lbl" x="245" y="95">Switch</text>
  <text class="sub" x="230" y="112">Fa0/1</text>

  <line class="ln" x1="310" y1="95" x2="400" y2="95"/>
  <circle class="box" cx="440" cy="95" r="40"/>
  <text class="lbl" x="415" y="90">R1</text>
  <text class="sub" x="400" y="108">192.168.1.1/24</text>

  <line class="ln" x1="440" y1="135" x2="440" y2="170"/>
  <rect class="box" x="390" y="170" width="100" height="20" rx="4" fill="none" stroke="none"/>

  <line class="ln" x1="20" y1="150" x2="130" y2="150"/>
  <rect class="box" x="20" y="150" width="110" height="40" rx="6"/>
  <text class="lbl" x="45" y="172">PC1</text>
  <text class="sub" x="20" y="30">Networking 2 — DHCP topology (Q7)</text>
  <text class="sub" x="140" y="185">192.168.1.130/24</text>
  <line class="ln" x1="75" y1="120" x2="75" y2="150"/>
</svg>
