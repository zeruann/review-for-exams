<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .box { fill:#1e293b; stroke:#64748b; stroke-width:2; }
    .lbl { fill:#e2e8f0; font-size:13px; }
    .sub { fill:#94a3b8; font-size:10px; }
    .ln { stroke:#64748b; stroke-width:2; }
  </style>
  <text class="sub" x="20" y="20">RTR1 — Fa0/0 to PC-A subnet, Fa0/1 to DHCPv6 server subnet</text>

  <circle class="box" cx="300" cy="90" r="42"/>
  <text class="lbl" x="278" y="85">RTR1</text>
  <text class="sub" x="245" y="65">Fa0/0</text>
  <text class="sub" x="325" y="65">Fa0/1</text>

  <line class="ln" x1="260" y1="90" x2="150" y2="90"/>
  <rect class="box" x="90" y="70" width="60" height="40" rx="6"/>
  <text class="lbl" x="102" y="94">SW1</text>
  <text class="sub" x="150" y="55">2001:DB8:1234:5678::1/64</text>

  <line class="ln" x1="120" y1="110" x2="120" y2="150"/>
  <rect class="box" x="70" y="150" width="100" height="40" rx="6"/>
  <text class="lbl" x="95" y="174">PC-A</text>

  <line class="ln" x1="340" y1="90" x2="450" y2="90"/>
  <rect class="box" x="450" y="70" width="60" height="40" rx="6"/>
  <text class="lbl" x="462" y="94">SW2</text>
  <text class="sub" x="380" y="55">2001:DB8:1234:ABCD::1/64</text>

  <line class="ln" x1="480" y1="110" x2="480" y2="150"/>
  <rect class="box" x="430" y="150" width="110" height="40" rx="6"/>
  <text class="lbl" x="440" y="174">DHCPv6 Server</text>
  <text class="sub" x="430" y="205">2001:DB8:1234:ABCD::10/64</text>
</svg>
