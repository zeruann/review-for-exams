<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded Background Container with Teal Gradient -->
  <defs>
    <linearGradient id="catBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <rect width="64" height="64" rx="20" fill="url(#catBg)" />

  <!-- Outer Ears -->
  <path d="M14 26 L19 10 L30 20 Z" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M50 26 L45 10 L34 20 Z" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Inner Ears (Pink) -->
  <path d="M16 23 L19.5 13 L27 20 Z" fill="url(#earInner)" />
  <path d="M48 23 L44.5 13 L37 20 Z" fill="url(#earInner)" />

  <!-- Cat Head -->
  <ellipse cx="32" cy="35" rx="19" ry="16" fill="#FFFFFF" />

  <!-- Cat Cheeks Blush -->
  <circle cx="21" cy="40" r="3" fill="#FDA4AF" opacity="0.6" />
  <circle cx="43" cy="40" r="3" fill="#FDA4AF" opacity="0.6" />

  <!-- Eyes (Happy curved anime/chill eyes) -->
  <path d="M22 33 Q25 29 28 33" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M36 33 Q39 29 42 33" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Tiny Cute Nose -->
  <polygon points="32,37 30,35 34,35" fill="#F43F5E" />

  <!-- Mouth -->
  <path d="M30 38 Q32 40 32 37 Q32 40 34 38" stroke="#0F172A" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Whiskers Left -->
  <line x1="10" y1="36" x2="19" y2="37" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="11" y1="41" x2="19" y2="39" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Whiskers Right -->
  <line x1="54" y1="36" x2="45" y2="37" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="53" y1="41" x2="45" y2="39" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />
</svg>